<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%99%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <!-- The only user-facing German outside src/i18n/de.ts: the static shell
         cannot import the TS module, and setting it at boot would flash. -->
    <title>Transkript — Gottesdienst-Transkription</title>
    <script>
      // Resolve the theme before the first paint, otherwise a dark-mode reload
      // flashes white. Storage key mirrors THEME_STORAGE_KEY in src/lib/theme.tsx.
      (function () {
        try {
          var stored = localStorage.getItem("transkript-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          /* storage blocked — the CSS media query fallback takes over */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
